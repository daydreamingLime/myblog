name: Build and Deploy Hugo Blog

on:
  push:
    branches:
      - dev # 你的代码主分支是 dev

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          submodules: true # 确保主题子模块能拉取
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true # 支持扩展版，避免主题编译失败

      - name: Build the site
        run: hugo --gc --minify --baseURL "https://daydreaminglime.github.io/myblog/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
